
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event QR Check-In</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px;
      margin: 24px auto; padding: 16px; }
    input, select, button { box-sizing: border-box; width: 100%;
      padding: 13px; margin: 8px 0; font-size: 16px; }
    button { cursor: pointer; }
    #result { padding: 16px; margin-top: 12px; font-weight: bold;
      border-radius: 8px; background: #f1f5f9; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h2>Event QR Check-In</h2>

  <label for="entrance">Entrance</label>
  <select id="entrance">
    <option>Entrance 1</option>
    <option>Entrance 2</option>
    <option>Entrance 3</option>
  </select>

  <label for="pin">Staff PIN</label>
  <input id="pin" type="password" autocomplete="off"
         placeholder="Enter staff PIN">

  <div id="reader"></div>
  <div id="result" role="status" aria-live="polite">
    Enter your PIN and tap Start Scanner.
  </div>

  <button id="start">Start Scanner</button>
  <button id="next" hidden>Scan Next Participant</button>

<script>
(() => {
  // Replace with your actual deployed Apps Script /exec URL.
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwt-LAF9q8OxuL-66yafB7PHpSqYNnQHRKxI1ARG8BPgRs0EyzjnvGTgk5D3sI55iVT6Q/exec";

  const result = document.getElementById("result");
  const startBtn = document.getElementById("start");
  const nextBtn = document.getElementById("next");
  let scanner = null;
  let running = false;
  let busy = false;

  function show(message, color = "#222") {
    result.textContent = message;
    result.style.color = color;
  }

  function newId() {
    return crypto.randomUUID();
  }

  function getResult(requestId) {
    return new Promise(async resolve => {
      let finished = false;
      let script;

      const finish = value => {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        if (script) script.remove();
        delete window.__eventCheckinCallback;
        resolve(value);
      };

      window.__eventCheckinCallback = data => finish(data);

      const timer = setTimeout(
        () => finish({ result: "TIMEOUT" }), 2500
      );

      try {
        const url = new URL(GAS_URL);
        url.searchParams.set("action", "result");
        url.searchParams.set("requestId", requestId);
        url.searchParams.set("callback", "__eventCheckinCallback");
        url.searchParams.set("t", Date.now());

        script = document.createElement("script");
        script.src = url.toString();
        script.onerror = () => finish({ result: "NETWORK_ERROR" });
        document.body.appendChild(script);
      } catch (e) {
        finish({ result: "NETWORK_ERROR" });
      }
    });
  }

  async function submitToken(token) {
    const requestId = newId();
    const body = new URLSearchParams({
      action: "checkin",
      requestId,
      token,
      staffPin: document.getElementById("pin").value.trim(),
      entrance: document.getElementById("entrance").value
    });

    // Simple form-encoded POST; response is intentionally opaque.
    await fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      body
    });

    for (let i = 0; i < 12; i++) {
      await new Promise(resolve => setTimeout(resolve, 700));
      const data = await getResult(requestId);
      const status = data && data.result;

      if (status === "PENDING" || status === "TIMEOUT") continue;
      return status || "ERROR";
    }

    return "TIMEOUT";
  }

  async function onScan(decodedText) {
    if (busy) return;
    busy = true;
    startBtn.disabled = true;
    nextBtn.hidden = true;

    try {
      if (running) {
        await scanner.stop();
        running = false;
      }

      show("Verifying ticket…");

      const status = await submitToken(decodedText.trim());

      if (["VALID", "CHECKED_IN", "SUCCESS"].includes(status)) {
        show("ENTRY APPROVED", "#15803d");
      } else if (status === "ALREADY_USED") {
        show("ALREADY CHECKED IN — DO NOT ADMIT AGAIN", "#b91c1c");
      } else if (status === "INVALID" || status === "UNAUTHORIZED") {
        show("INVALID TICKET OR STAFF PIN", "#b91c1c");
      } else {
        show("Could not confirm the result. Check internet and Sheet before retrying.",
          "#b45309");
      }
    } catch (e) {
      show("Connection error. Verify the ticket status in the Sheet before retrying.",
        "#b45309");
    }

    startBtn.disabled = false;
    nextBtn.hidden = false;
    busy = false;
  }

  async function startScanner() {
    if (!document.getElementById("pin").value.trim()) {
      show("Enter your staff PIN first.", "#b45309");
      return;
    }

    if (!GAS_URL.startsWith("https://script.google.com/")) {
      show("Set the correct Apps Script /exec URL in index.html.", "#b91c1c");
      return;
    }

    try {
      if (!scanner) scanner = new Html5Qrcode("reader");
      startBtn.disabled = true;
      nextBtn.hidden = true;
      show("Starting camera…");

      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        onScan,
        () => {}
      );

      running = true;
      show("Ready — scan a participant ticket.");
    } catch (e) {
      startBtn.disabled = false;
      show("Camera could not start: " + String(e), "#b91c1c");
    }
  }

  startBtn.addEventListener("click", startScanner);
  nextBtn.addEventListener("click", startScanner);
})();
</script>
</body>
</html>
