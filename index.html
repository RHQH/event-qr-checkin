<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event QR Check-In</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:Arial,sans-serif;max-width:480px;margin:20px auto;padding:16px;color:#202124}
label{display:block;font-weight:bold;margin:14px 0 6px}select,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;font-size:16px;border-radius:8px}select{border:1px solid #aaa;background:#fff}button{border:0;background:#075985;color:#fff;font-weight:bold}button:disabled{opacity:.55}#reader{width:100%;margin-top:12px}#result{padding:16px;border-radius:8px;background:#f1f5f9;margin-top:14px;white-space:pre-line;font-weight:bold;overflow-wrap:anywhere}.ok{background:#dcfce7!important;color:#166534}.bad{background:#fee2e2!important;color:#991b1b}.note{font-size:13px;color:#555;line-height:1.45}
</style></head>
<body>
<h2>Event QR Check-In</h2>
<p class="note">Select your name before scanning. Internet and camera access are required.</p>
<label for="staffName">Staff name</label>
<select id="staffName" required>
<option value="">Select your name</option>
<option value="Staff 1">Staff 1</option>
<option value="Staff 2">Staff 2</option>
<option value="Staff 3">Staff 3</option>
</select>
<div id="reader"></div>
<div id="result" role="status" aria-live="polite">Select your name, then tap Start Scanner.</div>
<button id="start">Start Scanner</button>
<button id="next" hidden>Scan Next Participant</button>
<script>
(() => {
  // Replace this with the deployed Apps Script Web App URL ending in /exec.
  const GAS_URL = "PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE";
  const resultBox = document.getElementById('result');
  const startBtn = document.getElementById('start');
  const nextBtn = document.getElementById('next');
  let scanner = null, running = false, busy = false;
  function show(message, kind='') { resultBox.textContent=message; resultBox.className=kind; }
  function makeId() { return crypto.randomUUID(); }
  function getResult(requestId) {
    return new Promise(resolve => {
      let done=false, script=null;
      const finish = data => { if(done)return; done=true; clearTimeout(timer); if(script)script.remove(); delete window.__eventCheckinCallback; resolve(data); };
      window.__eventCheckinCallback = data => finish(data);
      const timer=setTimeout(()=>finish({result:'PENDING'}),2200);
      try {
        const u=new URL(GAS_URL); u.searchParams.set('action','result'); u.searchParams.set('requestId',requestId); u.searchParams.set('callback','__eventCheckinCallback'); u.searchParams.set('_',Date.now());
        script=document.createElement('script'); script.src=u.toString(); script.onerror=()=>finish({result:'NETWORK_ERROR'}); document.body.appendChild(script);
      } catch(e) { finish({result:'NETWORK_ERROR'}); }
    });
  }
  async function sendScan(token) {
    const requestId=makeId();
    const body=new URLSearchParams({action:'checkin',requestId,token,staffName:document.getElementById('staffName').value});
    // no-cors POST is intentional; result is retrieved through the JSONP endpoint.
    await fetch(GAS_URL,{method:'POST',mode:'no-cors',body});
    for(let i=0;i<15;i++) { await new Promise(r=>setTimeout(r,650)); const data=await getResult(requestId); if(data.result && data.result!=='PENDING') return data; }
    return {result:'TIMEOUT'};
  }
  async function onScan(decodedText) {
    if(busy)return; busy=true; startBtn.disabled=true; nextBtn.hidden=true;
    try {
      if(running){await scanner.stop();running=false;}
      show('Verifying ticket…');
      const data=await sendScan(decodedText.trim());
      const status=data.result;
      if(status==='VALID') show('ENTRY APPROVED\n'+(data.name||'')+'\nRegistration: '+(data.registrationId||'')+'\nStaff: '+(data.staff||document.getElementById('staffName').value)+'\n'+(data.time||''),'ok');
      else if(status==='ALREADY_USED') show('ALREADY CHECKED IN — DO NOT ADMIT AGAIN\n'+(data.name||'')+'\nRegistration: '+(data.registrationId||'')+'\nPreviously recorded: '+(data.time||''),'bad');
      else if(status==='INVALID') show('INVALID TICKET — ENTRY NOT ALLOWED','bad');
      else show('Could not confirm the result ('+status+'). Check the Google Sheet before retrying.','bad');
    } catch(e) { show('Connection problem. Check the Google Sheet before retrying.','bad'); }
    startBtn.disabled=false; nextBtn.hidden=false;
  }
  async function startScanner() {
    if(!document.getElementById('staffName').value){show('Please select your name first.','bad');return;}
    if(!GAS_URL.startsWith('https://script.google.com/')){show('Please set the correct Apps Script /exec URL in index.html.','bad');return;}
    if(!window.Html5Qrcode){show('Scanner library did not load. Check internet and reload.','bad');return;}
    startBtn.disabled=true;
    try { scanner=new Html5Qrcode('reader'); await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},onScan,()=>{}); running=true; show('Camera ready. Scan a participant ticket.'); }
    catch(e){startBtn.disabled=false;show('Camera could not start. Open this GitHub Pages URL in Chrome and allow camera access. '+e,'bad');}
  }
  startBtn.addEventListener('click',startScanner);
  nextBtn.addEventListener('click',async()=>{nextBtn.hidden=true;busy=false;show('Ready for the next participant.');await startScanner();});
})();
</script></body></html>
